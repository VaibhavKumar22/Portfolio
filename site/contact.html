<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Vaibhav Kumar</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <script>
      window.__PAGE__ = 'contact'
    </script>
    <div id="root" class="app-shell">
      <main class="page">
        <section class="stack">
          <h1>Get In Touch</h1>
          <p class="lead">
            Have a question or want to work together? Fill out the form or use my direct contact details
            below.
          </p>
        </section>

        <section class="contact-grid">
          <article class="card stack">
            <h3>Contact Information</h3>
            <p id="ci-email">
              <strong>Email:</strong>
              <a id="ci-email-link" href="#"></a>
            </p>
            <p id="ci-phone">
              <strong>Phone:</strong>
              <a id="ci-phone-link" href="#"></a>
            </p>
            <p>
              <strong>LinkedIn:</strong>
              <a id="ci-linkedin" href="#" target="_blank" rel="noreferrer"></a>
            </p>
            <p>
              <strong>GitHub:</strong>
              <a id="ci-github" href="#" target="_blank" rel="noreferrer"></a>
            </p>
          </article>

          <article class="card stack">
            <h3>Send a Message</h3>
            <form id="contact-form" class="contact-form">
              <div class="form-field">
                <label for="contact-name">Name *</label>
                <input id="contact-name" name="name" type="text" required />
              </div>
              <div class="form-field">
                <label for="contact-email">Email *</label>
                <input id="contact-email" name="email" type="email" required />
              </div>
              <div class="form-field">
                <label for="contact-subject">Subject *</label>
                <input id="contact-subject" name="subject" type="text" required />
              </div>
              <div class="form-field">
                <label for="contact-message">Message *</label>
                <textarea id="contact-message" name="message" rows="5" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send Message</button>
            </form>

            <p id="contact-form-status" class="form-status" hidden></p>
            <p id="contact-mailto-hint" class="form-status hint" hidden>
              Or email me directly:
              <a id="contact-mailto-href" href="#"></a>
            </p>
          </article>
        </section>
      </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/contact.js"></script>
    <script src="js/main.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var p = window.PORTFOLIO_DATA && window.PORTFOLIO_DATA.profile
        if (!p) return
        var e = document.getElementById('ci-email-link')
        var ph = document.getElementById('ci-phone-link')
        var li = document.getElementById('ci-linkedin')
        var gh = document.getElementById('ci-github')
        var mh = document.getElementById('contact-mailto-href')
        if (e) {
          e.href = 'mailto:' + p.contact.email
          e.textContent = p.contact.email
        }
        if (ph) {
          ph.href = 'tel:' + p.contact.phone.replace(/\s/g, '')
          ph.textContent = p.contact.phone
        }
        if (li) {
          li.href = p.contact.linkedin
          li.textContent = p.contact.linkedin
        }
        if (gh) {
          gh.href = p.contact.github
          gh.textContent = p.contact.github
        }
        if (mh) {
          mh.href = 'mailto:' + p.contact.email
          mh.textContent = p.contact.email
        }
      })
    </script>
  </body>
</html>
